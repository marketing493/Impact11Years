 --goldtext:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),linear-gradient(170deg,#FFFBEA 0%,#F7E3A1 40%,#EBC96B 75%,#F7E3A1 100%)}

:root[data-tone="blue"] .drape::before{display:none}

:root[data-tone="blue"] .drape.l{clip-path:polygon(0.0% 0.0%,100.0% 0.0%,94.3% 2.2%,88.8% 4.3%,83.6% 6.5%,78.6% 8.7%,73.9% 10.8%,69.4% 13.0%,65.1% 15.2%,61.1% 17.3%,57.3% 19.5%,53.8% 21.7%,50.5% 23.8%,47.5% 26.0%,44.7% 28.2%,42.2% 30.3%,39.8% 32.5%,37.8% 34.7%,36.0% 36.8%,34.4% 39.0%,33.0% 41.2%,31.9% 43.3%,31.1% 45.5%,30.5% 47.7%,30.1% 49.8%,30.0% 52.0%,31.6% 55.0%,33.1% 58.0%,34.6% 61.0%,36.1% 64.0%,37.5% 67.0%,38.9% 70.0%,40.2% 73.0%,41.3% 76.0%,42.4% 79.0%,43.3% 82.0%,44.1% 85.0%,44.8% 88.0%,45.3% 91.0%,45.7% 94.0%,45.9% 97.0%,46.0% 100.0%,0.0% 100.0%)}

:root[data-tone="blue"] .drape.l::after{left:calc(30% - 11px)}:root[data-tone="blue"] .drape.r::after{right:calc(30% - 11px)}

:root[data-tone="blue"]{
 --g-hero:linear-gradient(90deg,#264CD7 0%,#22388C 60%,#1C1B1B 100%);

 :root[data-tone="blue"] .env-card.portrait{left:14%;right:14%;top:10%;height:auto;padding:0;background:none;box-shadow:none}
 .env-card.portrait .bp-portrait{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 24px rgba(10,16,60,.45))}

 @keyframes passPortrait{0%{transform:translateY(0)}100%{transform:translateY(-52.7%)}}

@media (max-width:900px) and (prefers-reduced-motion:reduce){:root[data-tone="blue"] .env.open .env-card.portrait{animation:none;transform:translateY(-52.7%)}}

/* =====================================================================
   One gold palette, shaped to each element
   ===================================================================== */
:root{
 --gold-sheen:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),linear-gradient(170deg,#FFFBEA 0%,#F7E3A1 40%,#EBC96B 75%,#F7E3A1 100%);
 --gold-sphere:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),linear-gradient(170deg,#FFFBEA 0%,#F7E3A1 40%,#EBC96B 75%,#F7E3A1 100%);
 --gold-cylinder:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),linear-gradient(170deg,#FFFBEA 0%,#F7E3A1 40%,#EBC96B 75%,#F7E3A1 100%);
 --gold-bar:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),linear-gradient(170deg,#FFFBEA 0%,#F7E3A1 40%,#EBC96B 75%,#F7E3A1 100%);
 --gold-sweep:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),linear-gradient(170deg,#FFFBEA 0%,#F7E3A1 40%,#EBC96B 75%,#F7E3A1 100%);
 --gold-ring:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),linear-gradient(170deg,#FFFBEA 0%,#F7E3A1 40%,#EBC96B 75%,#F7E3A1 100%)}
/* gold buttons: sheen plus a soft top highlight, like polished metal */
[data-skin="royal"] .btn:not(.sec):not(.ghost):not(.white){background:var(--gold-sheen)}
/* round things are spheres: account circle, seal, step ticks, icon badges, toggles */
.top .gsignin .gs-av,.acct-av,[data-skin="royal"] .step.done .n,[data-skin="royal"] :is(.bt-ic,.acard .ic,.bn-ic,.js-dot),[data-skin="royal"] .val.open .val-ic,.tone-toggle .sk-knob,.how-n{background:var(--gold-sphere)}
:root[data-tone="blue"] .seal{background:var(--gold-sheen);box-shadow:inset 0 0 0 4px rgba(255,251,234,.35),inset 0 -6px 12px rgba(150,110,40,.35),0 6px 16px rgba(0,0,0,.35)}
:root[data-tone="blue"] .seal b{background:none;color:#6B4E1A;-webkit-text-fill-color:#6B4E1A;text-shadow:0 1px 0 rgba(255,251,234,.8),0 -1px 0 rgba(90,64,20,.35)}
/* poles and the flag are cylinders; rails and progress bars sweep along their length */
:root[data-tone="blue"] .t-flag{background:var(--gold-cylinder)}
.t-flag::after{background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),linear-gradient(170deg,#FFFBEA 0%,#F7E3A1 40%,#EBC96B 75%,#F7E3A1 100%)}
.vy-pin::after,[data-skin="royal"] :is(.hj-line b,.story-bar),[data-skin="royal"] .subnav .ind{background:var(--gold-sweep)}
/* small signs, chips and tabs: a gentle bar shading (lit from above) */
.t-sign,[data-skin="royal"] :is(.chip[aria-pressed="true"],.chip[aria-current="page"],.fchip[aria-pressed="true"]),:root[data-tone="blue"] :is(.zones button,.zrow,.viewbar button)[aria-pressed="true"],[data-skin="royal"] #toast,[data-skin="royal"] .rb-b.now{background:var(--gold-bar)}
/* bunting and floating sparkles: a diagonal sheen so each flag catches the light differently */
[data-skin="royal"] :is(.hj-deco i,.fl i){background:var(--gold-sheen)}

 background:radial-gradient(circle,rgba(255,220,130,.75) 0%,rgba(255,214,120,.38) 34%,rgba(255,214,120,.12) 52%,rgba(255,214,120,0) 68%);
 opacity:.25;transform:scale(.82);will-change:opacity,transform;animation:sealGlow 2.8s ease-in-out infinite alternate;transition:opacity .4s}

 .seal,.pen,.t-flag::after,.d-star,.chand .flame,.rh-u b.tk{animation:none!important}

 [data-skin="royal"] .top{background:rgba(7,15,48,.97)}

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

/* ---------- the Impact Grid: an interactive pixel field ----------
 Modes: countdown (pixel clock to the event), message (11 YEARS OF IMPACT), draw (paint your own cells).
 Every mode reacts to the pointer: a glowing trail follows it and a tap sends a ripple across the grid. */
class ImpactGrid{
 constructor(cv,opts={}){this.cv=cv;this.ctx=cv.getContext('2d');this.mode=opts.mode||'countdown';this.target=opts.target;this.onTick=opts.onTick;
  this.ripples=[];this.ptr=null;this.down=false;this.scroll=0;this.lastSec=-1;this.t0=performance.now();this.alive=true;this.visible=true;
  this.rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  this.resize();this.bind();for(let i=0;i<this.en.length;i++)this.en[i]=Math.random()*.6;this.frame=this.frame.bind(this);requestAnimationFrame(this.frame)}
 resize(){const W=this.cv.clientWidth||this.cv.parentElement.clientWidth;this.W=W;
  const cs=W>=1000?13:W>=760?11:W>=520?9:7,gap=cs>=11?3:2;this.cs=cs;this.gap=gap;this.cols=Math.max(24,Math.floor((W+gap)/(cs+gap)));
  this.wide=this.cols>=65;this.contentH=this.wide?14:31;this.rows=this.contentH+(this.wide?6:4);
  const n=this.cols*this.rows;this.lit=new Float32Array(n);this.en=new Float32Array(n);this.tg=new Uint8Array(n);this.paint=this.paint&&this.paint.length===n?this.paint:new Uint8Array(n);
  const dpr=Math.min(2,devicePixelRatio||1);this.H=this.rows*(cs+gap)-gap;this.cv.width=Math.round(W*dpr);this.cv.height=Math.round(this.H*dpr);this.cv.style.height=this.H+'px';this.ctx.setTransform(dpr,0,0,dpr,0,0);
  this.lastSec=-1;this.compose(true)}
 bind(){const c=this.cv;
  const cell=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)/(this.cs+this.gap),y:(e.clientY-r.top)/(this.cs+this.gap)}};
  this.h={move:e=>{this.ptr=cell(e);if(this.down&&this.mode==='draw')this.dab(this.ptr)},
   down:e=>{this.down=true;this.ptr=cell(e);try{c.setPointerCapture(e.pointerId)}catch(_){}if(this.mode==='draw')this.dab(this.ptr);else this.ripples.push({x:this.ptr.x,y:this.ptr.y,t:performance.now()})},
   up:()=>{this.down=false},leave:()=>{this.ptr=null;this.down=false},
   resize:()=>{if(Math.abs((this.cv.clientWidth||0)-this.W)>2)this.resize()}};
  c.addEventListener('pointermove',this.h.move);c.addEventListener('pointerdown',this.h.down);c.addEventListener('pointerup',this.h.up);c.addEventListener('pointerleave',this.h.leave);c.addEventListener('pointercancel',this.h.leave);
  addEventListener('resize',this.h.resize);
  this.io=new IntersectionObserver(es=>{this.visible=es[0].isIntersecting});this.io.observe(c)}
 destroy(){this.alive=false;const c=this.cv;c.removeEventListener('pointermove',this.h.move);c.removeEventListener('pointerdown',this.h.down);removeEventListener('resize',this.h.resize);this.io.disconnect()}
 setMode(m){this.mode=m;this.scroll=0;this.lastSec=-1;this.compose(true);for(let i=0;i<this.en.length;i++)this.en[i]=Math.max(this.en[i],Math.random()*.5)}
 clear(){this.paint.fill(0);this.ripples.push({x:this.cols/2,y:this.rows/2,t:performance.now()})}
 dab(p){const x=Math.floor(p.x),y=Math.floor(p.y);for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){const xx=x+dx-(dx&&0),yy=y+dy;if(xx>=0&&yy>=0&&xx<this.cols&&yy<this.rows){const i=yy*this.cols+xx;if(!this.paint[i]){this.paint[i]=1;this.en[i]=1}}}}

 <div class="hj-ui"><span class="hj-count tn">2015</span><div class="hj-line"><b></b>${JOURNEY.map((j,i)=>`<span style="left:${((i+1)/JOURNEY.length*100-100/JOURNEY.length/2).toFixed(1)}%">${j[0]}</span>`).join('')}</div></div></div></section>`}
class Journey{
 constructor(sec){this.sec=sec;this.pin=sec.querySelector('.hj-pin');this.track=sec.querySelector('.hj-track');this.panels=[...sec.querySelectorAll('.hj-panel')];this.ticks=[...sec.querySelectorAll('.hj-line span')];this.count=sec.querySelector('.hj-count');this.resize();this.update()}
 destroy(){}
 resize(){this.vw=this.pin.clientWidth;this.tw=this.track.scrollWidth;this.dist=Math.max(1,this.tw-this.vw);this.sec.style.height=(this.dist+innerHeight)+'px'}
 update(){const r=this.sec.getBoundingClientRect(),p=clamp(-r.top/this.dist),x=-p*this.dist,vw=this.vw;SCORE.setVisible(r.bottom>innerHeight*.4&&r.top<innerHeight*.6);
  this.track.style.transform=`translate3d(${x.toFixed(1)}px,0,0)`;this.pin.style.setProperty('--hx',x+'px');this.pin.style.setProperty('--p',p.toFixed(4));
  let act=0,best=1e9;
  this.panels.forEach((pn,i)=>{const left=pn.offsetLeft+x,w=pn.offsetWidth,center=left+w/2;
   pn.style.setProperty('--fill',(clamp((vw*.9-left)/(w*.75))*100).toFixed(1)+'%');
   pn.querySelector('.hj-deco')?.style.setProperty('--px',((center-vw/2)*-.35).toFixed(1));
   const dd=Math.abs(center-vw/2);if(dd<best){best=dd;act=i}});
  this.pin.style.backgroundColor=act===this.panels.length-1?'#264CD7':act%2?'#1C1B1B':'#264CD7';if(act===0)this.pin.style.backgroundColor='#1C1B1B';
  const yi=Math.max(0,act-1);this.ticks.forEach((t,i)=>t.classList.toggle('on',i<=yi&&act>0));if(this.count)this.count.textContent=JOURNEY[yi][0];SCORE.setChapter(Math.min(5,yi))}
}

const startMs=a=>Date.parse(`${a.date}T${a.start}:00${OFFSET}`), endMs=a=>Date.parse(`${a.date}T${a.end}:00${OFFSET}`);
const fmtDay=a=>new Date(startMs(a)).toLocaleDateString('en-IN',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'});
const fmtDayShort=a=>new Date(startMs(a)).toLocaleDateString('en-IN',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'});
const mins=a=>Math.round((endMs(a)-startMs(a))/6e4);
const dur=a=>{const m=mins(a);return m>=60?`${Math.floor(m/60)} h${m%60?' '+m%60+' min':''}`:`${m} min`};
function rel(ms){const d=ms-Date.now();if(d<=0)return 'now';const m=Math.round(d/6e4);if(m<60)return `in ${m} min`;const h=Math.floor(m/60);if(h<24)return `in ${h} h ${m%60} min`;const days=Math.round(d/864e5);return `in ${days} ${days===1?'day':'days'}`}

/* day at a glance: every session placed on a time axis, in lanes when they overlap */
function ribbon(list,opts={}){const d0=(list.find(a=>endMs(a)>Date.now())||list[0]);if(!d0)return '';const day=list.filter(a=>a.date===d0.date);
 const s=Math.floor(Math.min(...day.map(a=>toMin(a.start)))/60)*60,e=Math.ceil(Math.max(...day.map(a=>toMin(a.end)))/60)*60,span=e-s;
 const lanes=[];const placed=[...day].sort((a,b)=>toMin(a.start)-toMin(b.start)).map(a=>{let l=lanes.findIndex(end=>end<=toMin(a.start));if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=toMin(a.end);return [a,l]});
 const pct=m=>((m-s)/span*100).toFixed(3);
 const hours=[];for(let m=s;m<=e;m+=60)hours.push(`<span style="left:${pct(m)}%">${fmtMin(m)}</span>`);
 return `<div class="ribbon" data-ribbon data-start="${s}" data-span="${span}" data-date="${d0.date}" style="--lanes:${lanes.length}">
 <div class="rb-track">${placed.map(([a,l])=>{const st=statusOf(a);return `<button class="rb-b ${st} ${inPlan(a.id)?'star':''} ${opts.sel===a.id?'sel':''}" style="left:${pct(toMin(a.start))}%;width:calc(${pct(toMin(a.end))}% - ${pct(toMin(a.start))}% - 3px);--lane:${l}" data-act="openAct" data-arg="${esc(a.id)}" aria-label="${a.start} ${esc(a.title)}, ${esc(a.location)}"><span class="rb-ic">${ic(catIcon(a.category),14)}</span><span class="rb-t">${esc(a.title)}</span><span class="rb-tip"><b>${a.start} to ${a.end}</b>${esc(a.title)}<em>${esc(a.location)}</em></span></button>`}).join('')}<i class="rb-now" hidden><b>Now</b></i></div>
 <div class="rb-hours">${hours.join('')}</div></div>`}
function tickRibbons(){$$('[data-ribbon]').forEach(r=>{const now=r.querySelector('.rb-now');if(!now)return;const m=istNowMin(),s=+r.dataset.start,sp=+r.dataset.span;
 const on=istToday()===r.dataset.date&&m>=s&&m<=s+sp;now.hidden=!on;if(on)now.style.left=((m-s)/sp*100)+'%'})}

function mountCounters(){const els=$$('[data-count]');if(!els.length||RMQ.matches||!('IntersectionObserver' in window))return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,n=+el.dataset.count,suf=el.dataset.suffix||'',t0=performance.now();
  const f=t=>{const q=Math.min(1,(t-t0)/1300),v=Math.round(n*(1-Math.pow(1-q,3)));el.textContent=v+suf;if(q<1)requestAnimationFrame(f)};el.textContent='0'+suf;requestAnimationFrame(f)}),{threshold:.6});
 els.forEach(el=>io.observe(el))}

/* split-flap departures board */
const FLAP=' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-.&';
class Board{constructor(el){this.el=el;this.rows=el.querySelector('.brows');this.alive=true;this.timers=[];this.build(true);
  /* hovering a row re-flips its letters, left to right, like a split-flap row updating (mouse only, at most once a second per row) */
  if(matchMedia('(hover: hover) and (pointer: fine)').matches&&!RMQ.matches)this.rows.addEventListener('mouseover',e=>{const row=e.target.closest('.brow');if(!row||row.contains(e.relatedTarget)||!this.played)return;const now=Date.now();if(now-(+row.dataset.fl||0)<1100)return;row.dataset.fl=now;
   [...row.querySelectorAll('.fc')].forEach((c,i)=>this.flip(c,i*16))});
  this.io=new IntersectionObserver(es=>{if(es[0].isIntersecting&&!this.played){this.played=true;this.flipAll()}},{threshold:.3});this.io.observe(el);
  this.iv=setInterval(()=>{if(!document.hidden)this.build(false)},30000)}
 stop(){this.alive=false;this.io.disconnect();clearInterval(this.iv);this.timers.forEach(clearTimeout);this.raf&&cancelAnimationFrame(this.raf)}
 cols(){const narrow=innerWidth<700;return {narrow,dest:innerWidth<400?13:narrow?14:27,gate:narrow?0:10,rem:narrow?8:9}}
 status(a){const n=Date.now(),s=startMs(a),e=endMs(a);if(n>=e)return ['DEPARTED','gone'];if(n>=s)return ['NOW','now'];if(s-n<=10*6e4)return ['BOARDING','board'];return ['ON TIME','ok']}
 build(first){const C=this.cols(),list=S.acts.filter(a=>endMs(a)>Date.now()-30*6e4);
  const cell=(txt,w)=>{const t=txt.toUpperCase().replace(/[’']/g,'').replace(/[^A-Z0-9:\-.& ]/g,' ').padEnd(w).slice(0,w);return [...t].map(ch=>`<span class="fc" data-c="${ch}">${first&&!this.played?' ':ch}</span>`).join('')};
  const html=list.map(a=>{const [st,cls]=this.status(a);return `<div class="brow ${cls}"><span>${cell(a.start,5)}</span><span>${cell(boardName(a,C.narrow,C.dest),C.dest)}</span>${C.gate?`<span class="bg">${cell(a.location,C.gate)}</span>`:''}<span class="rem">${cell(st,st.length)}</span></div>`}).join('')||`<div class="empty">All flights have departed. Thank you for travelling with us.</div>`;
  if(first||!this.played){this.rows.innerHTML=html;return}
  /* later refreshes: only flip cells that changed */
  const tmp=document.createElement('div');tmp.innerHTML=html;const old=[...this.rows.querySelectorAll('.fc')],nu=[...tmp.querySelectorAll('.fc')];
  if(old.length!==nu.length){this.rows.innerHTML=html;return}nu.forEach((n,i)=>{if(old[i].dataset.c!==n.dataset.c){old[i].dataset.c=n.dataset.c;this.flip(old[i],0)}});
  [...tmp.querySelectorAll('.brow')].forEach((r,i)=>{const o=this.rows.children[i];if(o)o.className=r.className})}
 /* all tiles flip from one frame loop: no timer per tile, no forced layout, two alternating animation classes */

async function registerSW(){if(!('serviceWorker' in navigator)||!isSecureContext||inFrame)return null;try{SW=await navigator.serviceWorker.register('/sw.js');return SW}catch(e){return null}}

const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};

async function remindersOn(){

 const perm=await Notification.requestPermission();
 if(perm!=='granted'){toast('Notifications stay off. You can allow them later in settings.');refreshReminders();return}
 const reg=SW||await registerSW();
 if(S.server&&S.cfg.push&&reg&&'PushManager' in window){
  try{await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(S.cfg.vapidPublicKey)});

  catch(e){S.pwa.mode='local';toast('Push is not available, so reminders work while the app is open.')}}

let TIMERS=[];
function clearLocal(){TIMERS.forEach(clearTimeout);TIMERS=[]}
/* Local fallback: while the app is open, fire each reminder ourselves. Skipped when server push is active. */
async function scheduleLocal(){clearLocal();if(!S.pwa.on||!('Notification' in window)||Notification.permission!=='granted')return;
 if(S.pwa.mode===null){try{const reg=SW||await navigator.serviceWorker?.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();S.pwa.mode=sub&&S.cfg.push?'push':'local'}catch(e){S.pwa.mode='local'}}
 if(S.pwa.mode==='push')return;
 const now=Date.now(),fired=store.get('ia11-fired',{});
 for(const a of S.acts){const at=startMs(a)-LEAD_MIN*6e4,key=a.id+a.date+a.start;if(fired[key])continue;const wait=at-now;
  if(wait<=0&&startMs(a)>now){fired[key]=1;store.set('ia11-fired',fired);showLocal(`Starting in ${Math.max(1,Math.round((startMs(a)-now)/6e4))} minutes`,`${a.title}, ${a.location} at ${a.start}`,'act-'+a.id)}
  else if(wait>0&&wait<864e5)TIMERS.push(setTimeout(()=>{const f=store.get('ia11-fired',{});if(f[key])return;f[key]=1;store.set('ia11-fired',f);showLocal(`Starting in ${LEAD_MIN} minutes`,`${a.title}, ${a.location} at ${a.start}`,'act-'+a.id)},wait))}}

   Entry passes: each signed-in person's QR (name + email + fixed 6-digit PIN), drawn in the site's style,
   and the organiser check-in scanner (camera + typed PIN fallback).
   ===================================================================== */

/* the person's pass, kept on the device so it still shows with weak venue Wi-Fi */

const GUEST=(()=>{let g=store.get('ia11-guest','');if(!/^[a-z0-9]{12}$/.test(g)){g=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');store.set('ia11-guest',g)}return g})();

/** A QR code as SVG: rounded dots, rounded eyes and the gold "11" badge (error correction H covers the badge). */
function qrSvg(text,{badge=true,cls='qr'}={}){
 qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
 const q=qrcode(0,'H');q.addData(text,'Byte');q.make();
 const n=q.getModuleCount(),Q=4,N=n+Q*2,k=Math.max(5,Math.round(n*.22))|1,s=(n-k)>>1;
 const finder=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7),hole=(r,c)=>badge&&r>=s&&r<s+k&&c>=s&&c<s+k;
 let dots='';for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(!q.isDark(r,c)||finder(r,c)||hole(r,c))continue;dots+=`<rect x="${c+Q+.06}" y="${r+Q+.06}" width=".88" height=".88" rx=".38"/>`}
 /* gentle rounding on the eyes keeps every eye module solid, so strict scanners read them too */
 const eye=(r,c)=>`<rect x="${c+Q}" y="${r+Q}" width="7" height="7" rx="1"/><rect x="${c+Q+1}" y="${r+Q+1}" width="5" height="5" rx=".55" fill="#fff"/><rect x="${c+Q+2}" y="${r+Q+2}" width="3" height="3" rx=".6"/>`;
 const cx=Q+s+k/2,R=k/2-.4;
 const b=badge?`<circle cx="${cx}" cy="${cx}" r="${R}" fill="#D4AF61"/><circle cx="${cx}" cy="${cx}" r="${(R*.84).toFixed(2)}" fill="#1C1B1B"/><text x="${cx}" y="${(cx+R*.37).toFixed(2)}" text-anchor="middle" font-family="Spectral,Georgia,serif" font-size="${(R*1.05).toFixed(2)}" fill="#D4AF61">11</text>`:'';

const passLogo=()=>`<span class="bp-logo" aria-hidden="true"><img src="${LOGO_COLOR}" alt="" width="900" height="279"></span>`;
function passQr(){return passLogo()+(S.pass?qrSvg(S.pass.code):`<span class="qr-ph">${qrSvg('IA11 entry pass',{cls:'qr'})}</span>`)}

/* demo: if the server can't issue a pass (no database, offline), make this device's pass here so the QR always shows */
function localPass(){let h=0;for(const c of GUEST)h=(h*31+c.charCodeAt(0))>>>0;const pin=String(100000+h%900000),email=`guest-${GUEST}@demo.impactanalytics.co`;
 return {name:'Prashant Agrawal',email,pin,code:`IA11|${pin}|${email}|Prashant Agrawal`,checkedIn:false,local:true}}
function useLocalPass(){if(S.pass&&S.pass.pin&&S.pass.name==='Prashant Agrawal')return;S.pass=localPass();if(typeof applyPassenger==='function')applyPassenger()}
async function loadPass(force){if(!force&&S.pass&&S.pass.pin&&!S.pass.local&&S.pass.name==='Prashant Agrawal')return;
 if(!S.server){useLocalPass();return}
 try{const r=await fetch('/api/pass',{cache:'no-store',headers:{'x-guest-id':GUEST}});if(!r.ok){useLocalPass();return}const p=await r.json();
  S.pass=p;store.set('ia11-pass',p);if(typeof applyPassenger==='function')applyPassenger()}catch(e){useLocalPass()}}

/* tapping the QR on the opened pass shows it large, with the name and PIN, ready for the door */
addEventListener('click',e=>{const stub=e.target.closest&&e.target.closest('.env.open .bp-stub');if(!stub)return;e.preventDefault();e.stopPropagation();showPass()},true);
function showPass(){if(!S.pass){toast('Your entry pass is loading. Try again in a moment.');return}
 const p=S.pass,w=document.createElement('div');w.className='modal-w how-w pass-w';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label','Your entry pass');
 w.innerHTML=`<div class="modal how pass-big"><div class="how-h"><h3>Your entry pass</h3><button class="icon-btn how-x" aria-label="Close">${ic('x',18)}</button></div>
  <div class="pb-qr">${qrSvg(p.code)}</div>
  <div class="pb-who"><b>${esc(p.name)}</b><span>${esc(p.email)}</span></div>
  <div class="pb-pin"><small>PIN</small><b class="tn">${p.pin.slice(0,3)} ${p.pin.slice(3)}</b></div>
  <p class="pb-note">Show this at the entrance on 17 December. Turn your screen brightness up.</p></div>`;
 const close=()=>{w.remove();document.removeEventListener('keydown',k)},k=e=>{if(e.key==='Escape')close()};
 w.addEventListener('click',e=>{if(e.target===w||e.target.closest('.how-x'))close()});document.addEventListener('keydown',k);document.body.append(w)}

/* ---------- organiser check-in scanner ---------- */
let CK=null;
function loadJsQR(){return window.jsQR?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='/jsqr.js';s.onload=ok;s.onerror=no;document.head.append(s)})}
async function openCheckin(){if(CK)return;
 const w=document.createElement('div');w.className='ck-w';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label','Entrance check-in');
 w.innerHTML=`<div class="ck"><div class="ck-h"><h3>Entrance check-in</h3><span class="ck-count tn"></span><button class="icon-btn ck-x" aria-label="Close scanner">${ic('x',18)}</button></div>
  <div class="ck-cam"><video playsinline muted></video><span class="ck-aim" aria-hidden="true"></span><p class="ck-msg">Starting the camera…</p></div>
  <div class="ck-res" role="status" aria-live="assertive"></div>
  <form class="ck-pin"><label for="ck-pin">Or type their 6-digit PIN</label><div class="row"><input id="ck-pin" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="123 456"><button class="btn" type="submit">Check in</button></div></form></div>`;
 document.body.append(w);
 const video=w.querySelector('video'),msg=w.querySelector('.ck-msg'),res=w.querySelector('.ck-res'),count=w.querySelector('.ck-count');
 CK={w,stream:null,timer:0,last:'',lastAt:0,busy:false};

  let y=scrollY+r.bottom+gap-innerHeight;const envTop=scrollY+r.top-hdr-24;if(y>envTop)y=envTop;y=Math.max(y,scrollY+sec.top-hdr);scrollTo({top:Math.max(0,y),behavior:how});return true}
 el.scrollIntoView({behavior:how,block:'start'});return true}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented)return;const id=a.getAttribute('href').slice(1);
 /* the header logo: on the home page, glide back up to the hero (from the organizer page it still goes home) */
 if(id==='home'&&S.route==='home'){e.preventDefault();scrollTo({top:0,behavior:RMQ.matches?'auto':'smooth'});try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}return}
 if(!id||id==='admin'||S.route!=='home'||!document.getElementById(id))return;e.preventDefault();glideTo(id);try{history.replaceState(null,'','#'+id)}catch(_){}},true);
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(S.route==='home'&&id&&id!=='admin'&&!id.startsWith('event-')&&glideTo(id))return;const jump=parseHash();render();if(jump){requestAnimationFrame(()=>document.getElementById(jump)?.scrollIntoView({behavior:'smooth'}))}else scrollTo({top:0})});
document.addEventListener('change',e=>{if(e.target.id==='wayfind'&&e.target.value){const a=S.acts.find(x=>x.id===e.target.value);if(a){ACT.zone(a.location);toast(`Follow the orange path to the ${a.location} for ${a.title}.`);$('.ex-stage')?.scrollIntoView({behavior:'smooth',block:'center'})}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ticks();scheduleLocal()}});

/* ---------- boot ---------- */
(async()=>{startAmbient();const jump=parseHash();S.acts=sortActs(store.get('ia11-acts-cache',null)||store.get('ia11-acts',DEFAULT_ACTIVITIES));const bootSig=actsSig(S.acts);render();
 await Promise.all([loadData(),registerSW()]);
 if(S.server&&S.cfg.admin&&A_.key)await adminLogin(A_.key);
 if(S.server)store.set('ia11-acts-cache',S.acts);
 if(S.route==='home'&&S.skin==='royal')softRefresh(actsSig(S.acts)!==bootSig);else render();scheduleLocal();
 if(jump&&jump!=='admin')setTimeout(()=>glideTo(jump),60)})();

</script>
</body>
