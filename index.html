/* =====================================================================
   Impact Blue version, aligned to the IA brand guidelines.
   Brand palette only: Impact Blue #264CD7, Black #1C1B1B, Off-White #F4F4F6, White, Grays, Accent Orange (sparingly).
   Gold and ivory stay as the celebration accents. Headlines in Spectral Light (the ABC Otto alternate), text in Inter Tight.
   Shading uses Black or White overlays on Impact Blue, never new blues.
   ===================================================================== */
:root[data-skin="royal"][data-tone="blue"]{
 --bg:#264CD7;--surface:rgba(28,27,27,.24);--surface-2:rgba(28,27,27,.36);--fg:#FFFFFF;--muted:rgba(244,244,246,.82);--faint:rgba(244,244,246,.55);
 --line:rgba(244,244,246,.22);--line-2:rgba(244,244,246,.34);--blue:#264CD7;--orange:#FF6F1C;
 --f-royal:'Spectral',Georgia,'Times New Roman',serif}

:root[data-tone="blue"] body::before{background:#264CD7}

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

 const url=URL.createObjectURL(new Blob([txt],{type:'text/calendar'})),el=document.createElement('a');el.href=url;el.download=a.title.replace(/[^\w]+/g,'-').toLowerCase()+'.ics';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Calendar file ready. Open it to add the session.')}

/* day at a glance: every session placed on a time axis, in lanes when they overlap */
function ribbon(list,opts={}){const d0=(list.find(a=>endMs(a)>Date.now())||list[0]);if(!d0)return '';const day=list.filter(a=>a.date===d0.date);
 const s=Math.floor(Math.min(...day.map(a=>toMin(a.start)))/60)*60,e=Math.ceil(Math.max(...day.map(a=>toMin(a.end)))/60)*60,span=e-s;
 const lanes=[];const placed=[...day].sort((a,b)=>toMin(a.start)-toMin(b.start)).map(a=>{let l=lanes.findIndex(end=>end<=toMin(a.start));if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=toMin(a.end);return [a,l]});
 const pct=m=>((m-s)/span*100).toFixed(3);
 const hours=[];for(let m=s;m<=e;m+=60)hours.push(`<span style="left:${pct(m)}%">${fmtMin(m)}</span>`);
 return `<div class="ribbon" data-ribbon data-start="${s}" data-span="${span}" data-date="${d0.date}" style="--lanes:${lanes.length}">
 <div class="rb-track">${placed.map(([a,l])=>{const st=statusOf(a);return `<button class="rb-b ${st} ${inPlan(a.id)?'star':''} ${opts.sel===a.id?'sel':''}" style="left:${pct(toMin(a.start))}%;width:calc(${pct(toMin(a.end))}% - ${pct(toMin(a.start))}% - 3px);--lane:${l}" data-act="openAct" data-arg="${esc(a.id)}" aria-label="${a.start} ${esc(a.title)}, ${esc(a.location)}"><span class="rb-ic">${ic(catIcon(a.category),14)}</span><span class="rb-t">${esc(a.title)}</span><span class="rb-tip"><b>${a.start} to ${a.end}</b>${esc(a.title)}<em>${esc(a.location)}</em></span></button>`}).join('')}<i class="rb-now" hidden><b>Now</b></i></div>
 <div class="rb-hours">${hours.join('')}</div></div>`}
function tickRibbons(){$$('[data-ribbon]').forEach(r=>{const now=r.querySelector('.rb-now');if(!now)return;const m=istNowMin(),s=+r.dataset.start,sp=+r.dataset.span;
 const on=istToday()===r.dataset.date&&m>=s&&m<=s+sp;now.hidden=!on;if(on)now.style.left=((m-s)/sp*100)+'%'})}

/* number that counts up when it scrolls into view */
const counter=(n,suffix='')=>`<b class="tn" data-count="${n}" data-suffix="${suffix}">${n}${suffix}</b>`;
function mountCounters(){const els=$$('[data-count]');if(!els.length||RMQ.matches||!('IntersectionObserver' in window))return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,n=+el.dataset.count,suf=el.dataset.suffix||'',t0=performance.now();
  const f=t=>{const q=Math.min(1,(t-t0)/1300),v=Math.round(n*(1-Math.pow(1-q,3)));el.textContent=v+suf;if(q<1)requestAnimationFrame(f)};el.textContent='0'+suf;requestAnimationFrame(f)}),{threshold:.6});
 els.forEach(el=>io.observe(el))}

const FLAP=' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-.&';

  if(matchMedia('(hover: hover) and (pointer: fine)').matches&&!RMQ.matches)this.rows.addEventListener('mouseover',e=>{const row=e.target.closest('.brow');if(!row||row.contains(e.relatedTarget)||!this.played)return;const now=Date.now();if(now-(+row.dataset.fl||0)<1100)return;row.dataset.fl=now;

  this.io=new IntersectionObserver(es=>{if(es[0].isIntersecting&&!this.played){this.played=true;this.flipAll()}},{threshold:.3});this.io.observe(el);

  const cell=(txt,w)=>{const t=txt.toUpperCase().replace(/[^A-Z0-9:\-.& ]/g,' ').padEnd(w).slice(0,w);return [...t].map(ch=>`<span class="fc" data-c="${ch}">${first&&!this.played?' ':ch}</span>`).join('')};
  const html=list.map(a=>{const [st,cls]=this.status(a);return `<div class="brow ${cls}"><span>${cell(a.start,5)}</span><span>${cell(boardName(a,C.narrow,C.dest),C.dest)}</span>${C.gate?`<span class="bg">${cell(a.location,C.gate)}</span>`:''}<span class="rem">${cell(st,C.rem)}</span></div>`}).join('')||`<div class="empty">All flights have departed. Thank you for travelling with us.</div>`;

/* ---------- Royal entrance: a luminous gold globe ----------
 The globe is drawn from the same Natural Earth dot mask as the voyage map, projected onto a turning sphere,

addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.pwa.prompt=e;if(S.route==='home')refreshReminders()});
addEventListener('appinstalled',()=>{S.pwa.prompt=null;toast('Added to your home screen.');refreshReminders()});
async function doInstall(){const p=S.pwa.prompt;if(!p)return;p.prompt();const r=await p.userChoice.catch(()=>null);S.pwa.prompt=null;if(r&&r.outcome==='accepted')toast('Installing the app.');refreshReminders()}
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};

async function remindersOn(){
 const ns=notifyStatus();if(ns!=='ok'){toast(NOTIFY_HELP[ns]);refreshReminders();return}
 const perm=await Notification.requestPermission();
 if(perm!=='granted'){toast('Notifications stay off. You can allow them later in settings.');refreshReminders();return}
 const reg=SW||await registerSW();
 if(S.server&&S.cfg.push&&reg&&'PushManager' in window){
  try{await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(S.cfg.vapidPublicKey)});
   const r=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});if(!r.ok)throw new Error((await r.json()).error);S.pwa.mode='push'}
  catch(e){S.pwa.mode='local';toast('Push is not available, so reminders work while the app is open.')}}
 else S.pwa.mode='local';
 S.pwa.on=true;store.set('ia11-reminders',true);scheduleLocal();
 if(S.pwa.mode==='push')toast('Reminders are on. You get an alert 10 minutes before each session.');
 else if(S.server)toast('Reminders are on while the app is open. Ask the organizers to finish push setup for closed-app alerts.');
 else toast('Reminders are on while the app is open.');
 refreshReminders()}
async function remindersOff(){S.pwa.on=false;store.set('ia11-reminders',false);clearLocal();
 try{const reg=SW||await navigator.serviceWorker?.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(sub){await fetch('/api/subscribe',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})}).catch(()=>{});await sub.unsubscribe()}}catch(e){}
 toast('Reminders are off.');refreshReminders()}
async function showLocal(title,body,tag){try{const reg=SW||await navigator.serviceWorker?.getRegistration();if(reg){await reg.showNotification(title,{body,tag,icon:'/icons/icon-192.png',badge:'/icons/badge-96.png',data:{url:'/#departures'}});return true}}catch(e){}

let TIMERS=[];
function clearLocal(){TIMERS.forEach(clearTimeout);TIMERS=[]}
/* Local fallback: while the app is open, fire each reminder ourselves. Skipped when server push is active. */
async function scheduleLocal(){clearLocal();if(!S.pwa.on||!('Notification' in window)||Notification.permission!=='granted')return;
 if(S.pwa.mode===null){try{const reg=SW||await navigator.serviceWorker?.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();S.pwa.mode=sub&&S.cfg.push?'push':'local'}catch(e){S.pwa.mode='local'}}
 if(S.pwa.mode==='push')return;
 const now=Date.now(),fired=store.get('ia11-fired',{});
 for(const a of S.acts){const at=startMs(a)-LEAD_MIN*6e4,key=a.id+a.date+a.start;if(fired[key])continue;const wait=at-now;
  if(wait<=0&&startMs(a)>now){fired[key]=1;store.set('ia11-fired',fired);showLocal(`Starting in ${Math.max(1,Math.round((startMs(a)-now)/6e4))} minutes`,`${a.title}, ${a.location} at ${a.start}`,'act-'+a.id)}
  else if(wait>0&&wait<864e5)TIMERS.push(setTimeout(()=>{const f=store.get('ia11-fired',{});if(f[key])return;f[key]=1;store.set('ia11-fired',f);showLocal(`Starting in ${LEAD_MIN} minutes`,`${a.title}, ${a.location} at ${a.start}`,'act-'+a.id)},wait))}}

/* =====================================================================
   Entry passes: each signed-in person's QR (name + email + fixed 6-digit PIN), drawn in the site's style,
   and the organiser check-in scanner (camera + typed PIN fallback).
   ===================================================================== */

/* the person's pass, kept on the device so it still shows with weak venue Wi-Fi */
S.pass=(()=>{const p=store.get('ia11-pass',null);return p&&S.user&&p.email===S.user.email?p:null})();

/** A QR code as SVG: rounded dots, rounded eyes and the gold "11" badge (error correction H covers the badge). */
function qrSvg(text,{badge=true,cls='qr'}={}){
 qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
 const q=qrcode(0,'H');q.addData(text,'Byte');q.make();
 const n=q.getModuleCount(),Q=4,N=n+Q*2,k=Math.max(5,Math.round(n*.22))|1,s=(n-k)>>1;
 const finder=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7),hole=(r,c)=>badge&&r>=s&&r<s+k&&c>=s&&c<s+k;
 let dots='';for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(!q.isDark(r,c)||finder(r,c)||hole(r,c))continue;dots+=`<rect x="${c+Q+.06}" y="${r+Q+.06}" width=".88" height=".88" rx=".38"/>`}
 /* gentle rounding on the eyes keeps every eye module solid, so strict scanners read them too */
 const eye=(r,c)=>`<rect x="${c+Q}" y="${r+Q}" width="7" height="7" rx="1"/><rect x="${c+Q+1}" y="${r+Q+1}" width="5" height="5" rx=".55" fill="#fff"/><rect x="${c+Q+2}" y="${r+Q+2}" width="3" height="3" rx=".6"/>`;
 const cx=Q+s+k/2,R=k/2-.4;
 const b=badge?`<circle cx="${cx}" cy="${cx}" r="${R}" fill="#D4AF61"/><circle cx="${cx}" cy="${cx}" r="${(R*.84).toFixed(2)}" fill="#1C1B1B"/><text x="${cx}" y="${(cx+R*.37).toFixed(2)}" text-anchor="middle" font-family="Spectral,Georgia,serif" font-size="${(R*1.05).toFixed(2)}" fill="#D4AF61">11</text>`:'';
 return `<svg class="${cls}" viewBox="0 0 ${N} ${N}" role="img" aria-label="Entry QR code" shape-rendering="geometricPrecision"><rect width="${N}" height="${N}" rx="2" fill="#fff"/><g fill="#1C1B1B">${dots}${eye(0,0)}${eye(0,n-7)}${eye(n-7,0)}</g>${b}</svg>`}

/** The boarding-pass stub: the person's QR, or a faded sample until their pass has loaded. */
function passQr(){return S.pass?qrSvg(S.pass.code):`<span class="qr-ph">${qrSvg('IA11 entry pass',{cls:'qr'})}</span>`}

async function loadPass(force){if(!S.user||!S.server)return;if(!force&&S.pass&&S.pass.email===S.user.email)return;
 try{const r=await fetch('/api/pass',{cache:'no-store',credentials:'same-origin'});if(!r.ok)return;const p=await r.json();
  S.pass=p;store.set('ia11-pass',p);if(typeof applyPassenger==='function')applyPassenger()}catch(e){}}

/* tapping the QR on the opened pass shows it large, with the name and PIN, ready for the door */
addEventListener('click',e=>{const stub=e.target.closest&&e.target.closest('.env.open .bp-stub');if(!stub)return;e.preventDefault();e.stopPropagation();showPass()},true);

 w.innerHTML=`<div class="modal how pass-big"><div class="how-h"><h3>Your entry pass</h3><button class="icon-btn how-x" aria-label="Close">${ic('x',18)}</button></div>

 w.innerHTML=`<div class="ck"><div class="ck-h"><h3>Entrance check-in</h3><span class="ck-count tn"></span><button class="icon-btn ck-x" aria-label="Close scanner">${ic('x',18)}</button></div>
  <div class="ck-cam"><video playsinline muted></video><span class="ck-aim" aria-hidden="true"></span><p class="ck-msg">Starting the camera…</p></div>
  <div class="ck-res" role="status" aria-live="assertive"></div>

 document.body.append(w);
 const video=w.querySelector('video'),msg=w.querySelector('.ck-msg'),res=w.querySelector('.ck-res'),count=w.querySelector('.ck-count');
 CK={w,stream:null,timer:0,last:'',lastAt:0,busy:false};
 const show=(kind,title,sub)=>{res.className='ck-res '+kind;res.innerHTML=`<b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}`;if(navigator.vibrate)navigator.vibrate(kind==='ok'?60:[40,60,40])};
 const tally=j=>{if(j&&typeof j.passes==='number')count.textContent=`${j.checkedIn} of ${j.passes} checked in`};
 async function check(body){if(CK.busy)return;CK.busy=true;
  try{const r=await fetch('/api/admin',{method:'POST',headers:adminHeaders(),body:JSON.stringify({action:'checkin',...body})});const j=await r.json().catch(()=>({}));
   if(r.status===401&&!j.reason){show('bad','Organizer sign-in expired','Close the scanner and sign in again.');return}
   if(j.ok&&!j.already)show('ok','Welcome, '+j.name,j.email);
   else if(j.ok)show('warn','Already checked in · '+j.name,'First scanned at '+new Date(j.at).toLocaleTimeString('en-IN',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}));
   else show('bad',j.error||'Not a valid pass','');tally(j)}
